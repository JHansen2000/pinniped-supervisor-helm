{{- range .Values.bindSecrets }}
{{- if not .name }}
{{- fail "each bindSecrets[] entry requires a name" }}
{{- end }}
{{- if .existingSecret }}
{{- include "pinniped-supervisor.verifyExistingSecret" (dict "root" $ "path" (printf "bindSecrets[%s]" .name) "name" .name "type" "kubernetes.io/basic-auth" "keys" (list "username" "password")) }}
{{- else }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "pinniped-supervisor.labels" $ | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: {{ required (printf "bindSecrets[%s].username is required" .name) .username | quote }}
  password: {{ required (printf "bindSecrets[%s].password is required" .name) .password | quote }}
---
{{- end }}
{{- end }}
