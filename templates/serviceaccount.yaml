{{- if .Values.serviceAccount.supervisor.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pinniped-supervisor.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pinniped-supervisor.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.supervisor.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
