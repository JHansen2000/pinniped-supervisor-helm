{{- range .Values.githubClientSecrets }}
{{- if not .name }}
{{- fail "each githubClientSecrets[] entry requires a name" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "pinniped-supervisor.labels" $ | nindent 4 }}
type: secrets.pinniped.dev/github-client
stringData:
  clientID: {{ required (printf "githubClientSecrets[%s].clientID is required" .name) .clientID | quote }}
  clientSecret: {{ required (printf "githubClientSecrets[%s].clientSecret is required" .name) .clientSecret | quote }}
---
{{- end }}
