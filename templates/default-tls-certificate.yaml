{{- if .Values.defaultTLSCertificate.enabled }}
{{- $fullname := include "pinniped-supervisor.fullname" . }}
{{- $issuerName := .Values.defaultTLSCertificate.issuer.name }}
{{- $issuerKind := .Values.defaultTLSCertificate.issuer.kind | default "Issuer" }}
{{- if .Values.defaultTLSCertificate.issuer.create }}
{{- $issuerName = printf "%s-default-tls-issuer" $fullname }}
{{- $issuerKind = "Issuer" }}
{{- else if not $issuerName }}
{{- fail "defaultTLSCertificate.issuer.name is required when defaultTLSCertificate.issuer.create=false" }}
{{- end }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $fullname }}-default-tls-certificate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pinniped-supervisor.labels" . | nindent 4 }}
spec:
  # Intentionally always matches names.defaultTLSCertificateSecret (see configmap.yaml)
  # https://pinniped.dev/docs/howto/supervisor/configure-supervisor/
  secretName: {{ printf "%s-default-tls-certificate" $fullname }}
  privateKey:
    rotationPolicy: Always
    algorithm: RSA
    encoding: PKCS1
    size: 2048
  duration: {{ .Values.defaultTLSCertificate.duration }}
  renewBefore: {{ .Values.defaultTLSCertificate.renewBefore }}
  isCA: false
  usages:
    - server auth
    - client auth
  subject:
    organizations:
      - cert-manager
  # Only ever presented on cluster-internal connections (e.g. an ingress controller's backend
  # re-encryption hop); no external client authenticates against this cert's identity, so an
  # internal Service DNS name is sufficient and avoids coupling this to ingress.hosts/certificate.dnsNames.
  dnsNames:
    - {{ printf "%s.%s.svc" $fullname .Release.Namespace | quote }}
    - {{ printf "%s.%s.svc.cluster.local" $fullname .Release.Namespace | quote }}
  issuerRef:
    name: {{ $issuerName | quote }}
    kind: {{ $issuerKind }}
{{- end }}
