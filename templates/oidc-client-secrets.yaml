{{- range .Values.oidcClientSecrets }}
{{- if not .name }}
{{- fail "each oidcClientSecrets[] entry requires a name" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "pinniped-supervisor.labels" $ | nindent 4 }}
type: secrets.pinniped.dev/oidc-client
stringData:
  clientID: {{ required (printf "oidcClientSecrets[%s].clientID is required" .name) .clientID | quote }}
  clientSecret: {{ required (printf "oidcClientSecrets[%s].clientSecret is required" .name) .clientSecret | quote }}
---
{{- end }}
