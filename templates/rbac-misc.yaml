kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "pinniped-supervisor.fullname" . }}
  labels:
    {{- include "pinniped-supervisor.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "pinniped-supervisor.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: system:auth-delegator
  apiGroup: rbac.authorization.k8s.io
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "pinniped-supervisor.fullname" . }}-extension-apiserver-authentication-reader
  namespace: kube-system
  labels:
    {{- include "pinniped-supervisor.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "pinniped-supervisor.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: extension-apiserver-authentication-reader
  apiGroup: rbac.authorization.k8s.io
