{{- if .Values.ingress.enabled }}
{{- $hosts := .Values.ingress.hosts | compact | uniq }}
{{- if not $hosts }}
{{- fail "ingress.hosts must list at least one hostname when ingress.enabled=true" }}
{{- end }}
{{- $tlsSecretName := .Values.ingress.tlsSecretName | default .Values.certificate.secretName }}
{{- if not $tlsSecretName }}
{{- fail "ingress.tlsSecretName is required when ingress.enabled=true (or set certificate.secretName to fall back to the bundled Certificate's secret)" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "pinniped-supervisor.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pinniped-supervisor.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.ingressClassName }}
  ingressClassName: {{ . }}
  {{- end }}
  tls:
    - hosts:
        {{- range $hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ $tlsSecretName | quote }}
  rules:
    {{- range $hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "pinniped-supervisor.fullname" $ }}
                port:
                  number: 443
    {{- end }}
{{- end }}
